name: Build

on:
  push:
  workflow_dispatch:

# Necessario para criar a release "latest" e enviar os PDFs.
permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-lang-portuguese

      - name: Build English Resume
        working-directory: resumes/en
        run: pdflatex resume.tex

      - name: Build Portuguese Resume
        working-directory: resumes/pt-br
        run: pdflatex curriculo.tex

      - name: Upload generated PDFs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: |
            resumes/en/resume.pdf
            resumes/pt-br/curriculo.pdf

      # O portfolio baixa os curriculos direto desta release, com nome fixo:
      # https://github.com/BrenoOl1veira/resume-kit/releases/download/latest/<arquivo>.pdf
      # Assim o download e instantaneo e sempre reflete o ultimo push na branch padrao.
      - name: Publish PDFs to the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp resumes/en/resume.pdf breno-oliveira-resume-en.pdf
          cp resumes/pt-br/curriculo.pdf breno-oliveira-curriculo-pt-br.pdf
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Currículos mais recentes" \
            --notes "PDFs gerados automaticamente a cada push na branch padrão." \
            --latest
          gh release upload latest breno-oliveira-resume-en.pdf breno-oliveira-curriculo-pt-br.pdf --clobber
